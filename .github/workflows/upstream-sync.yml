name: Upstream Sync

on:
  schedule:
    - cron: "0 4 * * 1" # Every Monday at 4 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/langfuse/langfuse.git || true

      - name: Fetch upstream tags
        run: git fetch upstream --tags

      - name: Find latest upstream release tag
        id: latest
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: $LATEST_TAG"

      - name: Check if already synced
        id: check
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          if git merge-base --is-ancestor "$TAG" HEAD 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is already in dev branch — nothing to sync."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is NOT in dev branch — sync needed."
          fi

      - name: Create sync branch and open PR
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          BRANCH="upstream-sync/${TAG}"

          # Check if branch already exists
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists — PR likely already open."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git merge "$TAG" --no-edit || {
            echo "::warning::Merge conflict detected — resolve manually."
            git merge --abort
            exit 1
          }
          git push origin "$BRANCH"

          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "Upstream sync: ${TAG}" \
            --body "$(cat <<EOF
          ## Upstream Release ${TAG}

          This PR syncs the latest upstream release [\`${TAG}\`](https://github.com/langfuse/langfuse/releases/tag/${TAG}) into the \`dev\` branch.

          ### Before merging
          - [ ] Review [upstream release notes](https://github.com/langfuse/langfuse/releases/tag/${TAG})
          - [ ] Check for Postgres/ClickHouse migration changes (migrations run on ECS startup)
          - [ ] Verify Arnica scan passes
          - [ ] Confirm no breaking changes to env vars or config

          > Auto-generated by the upstream-sync workflow.
          EOF
          )"
